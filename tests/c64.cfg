# A plain C64 .prg: two bytes of load address, then everything from $0801.
MEMORY {
    LOADADDR: start = $07ff, size = $0002, type = ro, file = %O;
    MAIN:     start = $0801, size = $7000, type = rw, file = %O;
}
SEGMENTS {
    LOADADDR: load = LOADADDR, type = ro;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro,  optional = yes;
    BSS:      load = MAIN,     type = bss, define = yes;
}
